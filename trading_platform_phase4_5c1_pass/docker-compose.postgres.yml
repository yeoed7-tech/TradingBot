services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: paper
      POSTGRES_PASSWORD: local_test_only
      POSTGRES_DB: paper_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paper -d paper_test"]
      interval: 2s
      retries: 15
